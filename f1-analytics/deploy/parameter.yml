# fabric-cicd parameter.yml for f1-analytics (14-s7). Values per environment; no secrets here.
# Run: uv run --project tools/pbi-kit python tools/pbi-kit/deploy/deploy.py --repo powerbi --env Test --parameter deploy/parameter.yml [--dry-run]
# The workspace ids come from the CI environment (FABRIC_WS_TEST / FABRIC_WS_PROD), not from this file.
# Placeholders: replace the gateway shares with the real ones before the first publish.

find_replace:
  # Parquet marts folder (all star-schema tables). Committed value = the analyst's Mac path, so every publish rewrites it.
  # On the Service this is a share the on-premises gateway can read; Test and Prod read different exports.
  - find_value: 'expression DataFolder = "([^"]*)"'
    is_regex: "true"
    replace_value:
      Test: '\\pbi-gw01\f1\test\marts\'
      Prod: '\\pbi-gw01\f1\prod\marts\'
    item_type: "SemanticModel"
    item_name: "F1"
    file_path: "**/definition/expressions.tmdl"

  # Raw Kaggle CSV folder ('Sprint Raw' and 'Status Lookup' read sprint_results.csv / status.csv straight from it).
  - find_value: 'expression RawFolder = "([^"]*)"'
    is_regex: "true"
    replace_value:
      Test: '\\pbi-gw01\f1\test\raw\'
      Prod: '\\pbi-gw01\f1\prod\raw\'
    item_type: "SemanticModel"
    item_name: "F1"
    file_path: "**/definition/expressions.tmdl"

# The report is bound byPath to ../F1.SemanticModel: fabric-cicd rebinds it to the model it publishes
# in the same workspace, so no semantic_model_binding is needed.
